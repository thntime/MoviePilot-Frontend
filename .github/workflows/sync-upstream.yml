name: Sync Upstream

# 每天定时把上游 v3 分支合并进来。合并成功先本地跑类型检查，通过才推送；
# 有冲突时不推送，改为开 issue 说明哪些文件同步失败。
# 说明：前端仓库没有脚本生成的产物，所以不需要「自动采用上游 + 重新生成」的规则。
on:
  schedule:
    - cron: '0 19 * * *' # 03:00 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: thntime/MoviePilot-Frontend
      UPSTREAM_BRANCH: v3
      ISSUE_TITLE: 上游同步失败
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: v3
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch upstream
        id: fetch
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"
          before=$(git rev-parse HEAD)
          behind=$(git rev-list --count "HEAD..upstream/${UPSTREAM_BRANCH}")
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "upstream_head=$(git rev-parse "upstream/${UPSTREAM_BRANCH}")" >> "$GITHUB_OUTPUT"
          if [ "$behind" -eq 0 ]; then
            echo "上游无新提交，跳过"
          else
            echo "上游领先 ${behind} 个提交"
          fi

      - name: Merge upstream
        id: merge
        if: steps.fetch.outputs.behind != '0'
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit "upstream/${UPSTREAM_BRANCH}" > /tmp/merge.log 2>&1
          status=$?
          cat /tmp/merge.log
          if [ "$status" -ne 0 ]; then
            conflicts=$(git diff --name-only --diff-filter=U | sort)
            {
              echo "conflicts<<EOF"
              printf '%s\n' "$conflicts"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            git merge --abort
            echo "conflicted=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "conflicted=false" >> "$GITHUB_OUTPUT"

      - name: Verify merged tree
        id: verify
        if: steps.fetch.outputs.behind != '0' && steps.merge.outputs.conflicted == 'false'
        run: |
          set -uo pipefail
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          status=0
          yarn install --frozen-lockfile --network-timeout 600000 || status=1
          yarn typecheck || status=1
          if [ "$status" -ne 0 ]; then
            echo "合并结果本地校验未通过，不推送"
            git reset --hard "${{ steps.fetch.outputs.before }}"
            echo "verified=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "verified=true" >> "$GITHUB_OUTPUT"

      - name: Push merge
        if: steps.fetch.outputs.behind != '0' && steps.merge.outputs.conflicted == 'false' && steps.verify.outputs.verified == 'true'
        run: git push origin "HEAD:v3"

      - name: Report sync failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
          UPSTREAM_HEAD: ${{ steps.fetch.outputs.upstream_head }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${CONFLICTS:-}" ]; then
            body=$(printf '自动同步上游 `%s` 失败。\n\n- 仓库：`%s`\n- 上游提交：`%s`\n- 运行记录：%s\n\n失败发生在拉取、合并或合并后校验阶段，未推送任何改动，请查看运行日志。\n' \
              "$UPSTREAM_REPO" "$GITHUB_REPOSITORY" "${UPSTREAM_HEAD:-unknown}" "$RUN_URL")
          else
            files=$(printf '%s\n' "$CONFLICTS" | sed 's/^/- `/; s/$/`/')
            body=$(printf '自动同步上游 `%s` 失败，存在合并冲突，未推送任何改动。\n\n- 仓库：`%s`\n- 上游提交：`%s`\n- 运行记录：%s\n\n**同步失败的文件：**\n\n%s\n' \
              "$UPSTREAM_REPO" "$GITHUB_REPOSITORY" "${UPSTREAM_HEAD:-unknown}" "$RUN_URL" "$files")
          fi
          existing=$(gh issue list --state open --search "\"$ISSUE_TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$ISSUE_TITLE" --body "$body"
          fi
